# backend/src/test/resources/application-test.properties
# AI财务管理系统 - 测试环境配置

# Test Database Configuration - H2 内存数据库
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# H2 Console (for debugging in tests if needed)
spring.h2.console.enabled=false

# JWT Configuration for Testing
jwt.secret=test-secret-key-for-unit-tests-only
jwt.expiration=3600000

# Microsoft SSO Configuration (Test values)
sso.client-id=test-client-id
sso.client-secret=test-client-secret
sso.token-url=http://localhost/test/token
sso.user-info-url=http://localhost/test/userinfo
sso.redirect-uri=http://localhost/test/callback

# OpenAI Configuration (Test values)
openai.api.key=test-openai-key
ai.openai.api-url=http://localhost/test/openai
ai.openai.chat-model=gpt-4o-mini

# Test Server Configuration
server.port=0

# Logging Configuration for Tests
logging.level.org.example.backend=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.root=WARN

# Test-specific configurations
spring.test.database.replace=none
spring.jpa.open-in-view=false

# Disable banner in tests
spring.main.banner-mode=off

# Default test configuration - extends main application.properties for tests
spring.profiles.active=test

