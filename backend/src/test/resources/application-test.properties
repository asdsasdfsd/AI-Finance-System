# backend/src/test/resources/application-test.properties
# AI财务管理系统 - 测试环境配置 (修复版本)

# Test Database Configuration - H2 内存数据库
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# H2 Console (disabled for tests)
spring.h2.console.enabled=false

# JWT Configuration for Testing
jwt.secret=test-secret-key-for-unit-tests-only-must-be-long-enough
jwt.expiration=3600000

# Microsoft SSO Configuration (Test values)
sso.client-id=test-client-id
sso.client-secret=test-client-secret
sso.token-url=http://localhost/test/token
sso.user-info-url=http://localhost/test/userinfo
sso.redirect-uri=http://localhost/test/callback

# OpenAI Configuration (Test values)
openai.api.key=test-openai-key
ai.openai.api-key=test-openai-key
ai.openai.api-url=http://localhost/test/openai
ai.openai.chat-model=gpt-4o-mini
ai.openai.max-tokens=100
ai.openai.temperature=0.7
ai.openai.timeout-seconds=30
ai.openai.max-retries=3

# Test Server Configuration
server.port=0

# Logging Configuration for Tests
logging.level.org.example.backend=ERROR
logging.level.org.springframework.boot=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.root=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR

# Test-specific configurations
spring.test.database.replace=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration

# Disable banner in tests
spring.main.banner-mode=off

# Web environment for tests
spring.main.web-application-type=servlet

# Security disable for tests
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration