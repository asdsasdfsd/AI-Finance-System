@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)
@TestPropertySource(locations = "classpath:application.properties")
class ApplicationPropertiesIntegrationTest {

    @Autowired
    private DataSource dataSource;

    @Value("${jwt.secret}")
    private String jwtSecret;

    @Value("${jwt.expiration}")
    private long jwtExpiration;

    @Value("${sso.client-id}")
    private String ssoClientId;

    @Value("${sso.client-secret}")
    private String ssoClientSecret;

    @Value("${sso.token-url}")
    private String ssoTokenUrl;

    @Value("${sso.user-info-url}")
    private String ssoUserInfoUrl;

    @Value("${sso.redirect-uri}")
    private String ssoRedirectUri;

    @Value("${openai.api.key}")
    private String openaiApiKey;

    @Value("${ai.openai.api-url}")
    private String openaiApiUrl;

    @Value("${ai.openai.chat-model}")
    private String openaiChatModel;

    @LocalServerPort
    private int port;

    // 1. Application successfully connects to the MySQL database using the provided datasource configuration.
    @Test
    void test_database_connection_success() throws SQLException {
        try (Connection conn = dataSource.getConnection()) {
            Assertions.assertTrue(conn.isValid(2), "Database connection should be valid");
        }
    }

    // 2. JWT authentication works correctly with the configured secret and expiration time.
    @Test
    void test_jwt_authentication_success() {
        // Simple JWT generation and validation using io.jsonwebtoken
        io.jsonwebtoken.security.Keys;
        io.jsonwebtoken.Jwts;
        io.jsonwebtoken.Claims;
        io.jsonwebtoken.SignatureAlgorithm;

        String subject = "test-user";
        String token = io.jsonwebtoken.Jwts.builder()
                .setSubject(subject)
                .signWith(io.jsonwebtoken.security.Keys.hmacShaKeyFor(jwtSecret.getBytes()), io.jsonwebtoken.SignatureAlgorithm.HS256)
                .setExpiration(new java.util.Date(System.currentTimeMillis() + jwtExpiration))
                .compact();

        Claims claims = io.jsonwebtoken.Jwts.parserBuilder()
                .setSigningKey(io.jsonwebtoken.security.Keys.hmacShaKeyFor(jwtSecret.getBytes()))
                .build()
                .parseClaimsJws(token)
                .getBody();

        Assertions.assertEquals(subject, claims.getSubject());
    }

    // 3. Microsoft SSO integration authenticates users and retrieves user info using the configured endpoints and credentials.
    @Test
    void test_sso_authentication_success() {
        // This test will attempt to get a token from the Microsoft SSO endpoint using dummy credentials.
        // Since dummy credentials are used, we expect a 400 or 401, but the endpoint should be reachable.
        RestTemplate restTemplate = new RestTemplate();
        HttpHeaders headers = new HttpHeaders();
        headers.setContentType(MediaType.APPLICATION_FORM_URLENCODED);

        MultiValueMap<String, String> map = new LinkedMultiValueMap<>();
        map.add("client_id", ssoClientId);
        map.add("client_secret", ssoClientSecret);
        map.add("grant_type", "client_credentials");
        map.add("scope", "openid profile email");

        HttpEntity<MultiValueMap<String, String>> request = new HttpEntity<>(map, headers);

        ResponseEntity<String> response = restTemplate.postForEntity(ssoTokenUrl, request, String.class);

        Assertions.assertTrue(
            response.getStatusCode().is4xxClientError() || response.getStatusCode().is2xxSuccessful(),
            "SSO token endpoint should be reachable"
        );
    }

    // 4. Application fails to start when the database credentials are incorrect or the database is unreachable.
    @Test
    void test_database_connection_failure() {
        // Try to connect with wrong credentials
        String url = "jdbc:mysql://localhost:3306/testdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true";
        String username = "wrong_user";
        String password = "wrong_pass";
        try {
            java.sql.DriverManager.getConnection(url, username, password);
            Assertions.fail("Connection should fail with wrong credentials");
        } catch (SQLException ex) {
            Assertions.assertTrue(
                ex.getMessage().toLowerCase().contains("access denied") ||
                ex.getMessage().toLowerCase().contains("authentication"),
                "Should fail due to authentication error"
            );
        }
    }

    // 5. JWT authentication fails when the secret is missing or invalid.
    @Test
    void test_jwt_authentication_failure() {
        String subject = "test-user";
        String invalidSecret = "invalid-secret-key-should-not-work";
        String token = io.jsonwebtoken.Jwts.builder()
                .setSubject(subject)
                .signWith(io.jsonwebtoken.security.Keys.hmacShaKeyFor(jwtSecret.getBytes()), io.jsonwebtoken.SignatureAlgorithm.HS256)
                .setExpiration(new java.util.Date(System.currentTimeMillis() + jwtExpiration))
                .compact();

        Assertions.assertThrows(io.jsonwebtoken.security.SignatureException.class, () -> {
            io.jsonwebtoken.Jwts.parserBuilder()
                .setSigningKey(io.jsonwebtoken.security.Keys.hmacShaKeyFor(invalidSecret.getBytes()))
                .build()
                .parseClaimsJws(token);
        });
    }

    // 6. OpenAI API integration fails gracefully when the API key is missing or invalid.
    @Test
    void test_openai_api_key_missing_or_invalid() {
        RestTemplate restTemplate = new RestTemplate();
        HttpHeaders headers = new HttpHeaders();
        headers.setContentType(MediaType.APPLICATION_JSON);
        headers.setBearerAuth("invalid_key");

        Map<String, Object> body = new HashMap<>();
        body.put("model", "gpt-4o-mini");
        body.put("messages", new Object[] { Map.of("role", "user", "content", "Hello") });

        HttpEntity<Map<String, Object>> request = new HttpEntity<>(body, headers);

        try {
            restTemplate.postForEntity(openaiApiUrl, request, String.class);
            Assertions.fail("Should fail with invalid API key");
        } catch (org.springframework.web.client.HttpClientErrorException ex) {
            Assertions.assertEquals(HttpStatus.UNAUTHORIZED, ex.getStatusCode(), "Should return 401 Unauthorized");
        }
    }

    // Application successfully communicates with the OpenAI API using the configured endpoint and model.
    @Test
    void test_openai_api_integration_success() {
        RestTemplate restTemplate = new RestTemplate();
        HttpHeaders headers = new HttpHeaders();
        headers.setContentType(MediaType.APPLICATION_JSON);
        headers.setBearerAuth(openaiApiKey);

        Map<String, Object> body = new HashMap<>();
        body.put("model", openaiChatModel);
        body.put("messages", new Object[] { Map.of("role", "user", "content", "Hello, OpenAI!") });

        HttpEntity<Map<String, Object>> request = new HttpEntity<>(body, headers);

        ResponseEntity<String> response = restTemplate.postForEntity(openaiApiUrl, request, String.class);

        Assertions.assertTrue(
            response.getStatusCode().is2xxSuccessful() || response.getStatusCode().is4xxClientError(),
            "OpenAI API should respond with 2xx or 4xx status"
        );
        // Optionally, check for expected fields in the response body if status is 2xx
        if (response.getStatusCode().is2xxSuccessful()) {
            Assertions.assertTrue(response.getBody().contains("choices") || response.getBody().contains("id"),
                "Response should contain OpenAI completion fields");
        }
    }

    // Application fails to start or logs errors when required environment variables for SSO or OpenAI are missing.
    @Test
    void test_missing_environment_variables_handling() {
        // Simulate missing environment variables by clearing system properties and checking for exceptions or error logs.
        String originalOpenaiKey = System.getenv("OPENAI_API_KEY");
        String originalSsoClientId = System.getenv("SSO_CLIENT_ID");
        String originalSsoClientSecret = System.getenv("SSO_CLIENT_SECRET");

        try {
            // Unset environment variables (not possible directly in Java, so simulate by using empty values)
            System.setProperty("OPENAI_API_KEY", "");
            System.setProperty("SSO_CLIENT_ID", "");
            System.setProperty("SSO_CLIENT_SECRET", "");

            // Try to access the properties, expecting them to be the fallback dummy values or empty
            String openaiKey = System.getProperty("OPENAI_API_KEY", "");
            String ssoClientId = System.getProperty("SSO_CLIENT_ID", "");
            String ssoClientSecret = System.getProperty("SSO_CLIENT_SECRET", "");

            Assertions.assertTrue(openaiKey.isEmpty() || openaiKey.equals("dummy_key"),
                    "OpenAI API key should be missing or fallback to dummy_key");
            Assertions.assertTrue(ssoClientId.isEmpty() || ssoClientId.equals("dummy"),
                    "SSO client id should be missing or fallback to dummy");
            Assertions.assertTrue(ssoClientSecret.isEmpty() || ssoClientSecret.equals("dummy"),
                    "SSO client secret should be missing or fallback to dummy");

            // Attempt to use OpenAI API with missing key, should fail with 401
            RestTemplate restTemplate = new RestTemplate();
            HttpHeaders headers = new HttpHeaders();
            headers.setContentType(MediaType.APPLICATION_JSON);
            headers.setBearerAuth(openaiKey);

            Map<String, Object> body = new HashMap<>();
            body.put("model", openaiChatModel);
            body.put("messages", new Object[] { Map.of("role", "user", "content", "Test") });

            HttpEntity<Map<String, Object>> request = new HttpEntity<>(body, headers);

            try {
                restTemplate.postForEntity(openaiApiUrl, request, String.class);
                Assertions.fail("Should fail with missing or invalid API key");
            } catch (org.springframework.web.client.HttpClientErrorException ex) {
                Assertions.assertEquals(HttpStatus.UNAUTHORIZED, ex.getStatusCode(),
                        "Should return 401 Unauthorized due to missing/invalid OpenAI API key");
            }
        } finally {
            // Restore environment variables if possible (not always possible in Java)
            if (originalOpenaiKey != null) System.setProperty("OPENAI_API_KEY", originalOpenaiKey);
            if (originalSsoClientId != null) System.setProperty("SSO_CLIENT_ID", originalSsoClientId);
            if (originalSsoClientSecret != null) System.setProperty("SSO_CLIENT_SECRET", originalSsoClientSecret);
        }
    }
}