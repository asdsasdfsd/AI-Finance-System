# backend/src/test/resources/application-test.yml
# Test environment configuration

spring:
  # Test database configuration using H2
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  # JPA configuration for tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        
  # H2 Console for debugging (optional)
  h2:
    console:
      enabled: true
      path: /h2-console
      
  # SQL initialization
  sql:
    init:
      mode: always
      data-locations: classpath:data-test.sql
      schema-locations: classpath:schema-test.sql
      
  # Disable security auto-configuration for testing
  autoconfigure:
    exclude: 
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Logging configuration for tests
logging:
  level:
    org.example.backend: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.test: DEBUG
    
# Test-specific application properties
app:
  jwt:
    secret: test-secret-key-for-testing-purposes-only
    expiration: 3600000 # 1 hour for tests
    
  # Transaction limits for testing
  transaction:
    max-amount: 1000000.00
    require-approval-above: 10000.00
    
  # Disable external services in tests
  external:
    notification:
      enabled: false
    reporting:
      enabled: false

# Test profiles can be activated with @ActiveProfiles("test")
---
spring:
  config:
    activate:
      on-profile: test-integration

# Additional configuration for integration tests
testcontainers:
  mysql:
    image: mysql:8.0
    database: test_financial_db
    username: test_user
    password: test_password
    
---
spring:
  config:
    activate:
      on-profile: test-performance

# Configuration for performance testing
app:
  test:
    performance:
      max-transactions: 10000
      concurrent-users: 50
      test-duration: 60s